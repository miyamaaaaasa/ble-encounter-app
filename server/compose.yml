# はじめましてこんにちは — サーバー構成
#
#   Internet :443 ──> Caddy（自動TLS / セキュリティヘッダ / gzip / レート制限の外壁）
#                        └─ 内部ネットワーク ─> api（外部ポート非公開）
#                                                  └─ SQLite（named volume）
#
# 共有サーバーのため、CPU/メモリ上限とログ上限を明示して他ユーザーに影響を出さない。

services:
  api:
    build: .
    image: hajimemashite-api:latest
    container_name: hajime-api
    restart: unless-stopped
    # 外部にポートを出さない。到達経路は caddy 経由のみ。
    expose:
      - "8080"
    volumes:
      - api-data:/data
    networks:
      - internal
    # ADMIN_TOKEN: 文化祭運営パネルからの配信を許可する共有シークレット。
    # .env（Git管理外）から読み込む。未設定ならAPI側で機能自体を無効化する。
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
    # ─── セキュリティ強化 ───
    read_only: true          # ルートFSは読み取り専用（書けるのは /data のみ）
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ─── 資源上限（共有サーバー配慮）───
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
    healthcheck:
      # scratchイメージにcurlは無いので、api自身のTCP待受をcaddy側で監視する。
      # ここではプロセス生存のみをdockerに任せる。
      disable: true

  caddy:
    image: caddy:2-alpine
    container_name: hajime-caddy
    restart: unless-stopped
    ports:
      - "80:80"     # ACME(Let's Encrypt)チャレンジ + HTTPSへのリダイレクト
      - "443:443"
    # Basic認証のbcryptハッシュはCaddyfileに直接書かず環境変数で渡す
    # （'$' を含むためsed置換やcompose補間で壊れるのを避ける）。
    environment:
      - ADMIN_BASIC_AUTH_HASH=${ADMIN_BASIC_AUTH_HASH:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./admin_panel:/srv:ro   # 管理者パネルの静的ファイル（Basic認証の内側）
      - caddy-data:/data      # 証明書（消すと再取得になるので永続化）
      - caddy-config:/config
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 128M
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
    depends_on:
      - api

networks:
  internal:
    driver: bridge

volumes:
  api-data:
  caddy-data:
  caddy-config:
